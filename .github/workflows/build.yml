name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform & build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk WorldRadio-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldRadio-debug-apk
          path: WorldRadio-debug.apk
